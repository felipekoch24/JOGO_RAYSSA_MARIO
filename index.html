<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Rayssa</title>
    <style>
        body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { background: #5c94fc; border: 4px solid #fff; border-radius: 12px; width: 95vw; max-width: 900px; height: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .info { color: white; font-size: 24px; margin-bottom: 10px; font-weight: bold; text-shadow: 2px 2px #000; }
        .controls { display: flex; gap: 15px; margin-top: 15px; width: 95vw; max-width: 900px; justify-content: center; }
        button { background: #e60012; border: none; padding: 22px 0; color: white; font-size: 26px; border-radius: 12px; box-shadow: 0 6px #990000; flex: 1; font-weight: bold; cursor: pointer; user-select: none; }
        .btn-jump { background: #f1c40f; box-shadow: 0 6px #d4ac0d; color: #333; }
        button:active { box-shadow: 0 2px #990000; transform: translateY(4px); }
        #menu { position: absolute; background: rgba(0,0,0,0.95); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; gap: 20px; text-align: center; }
        .skin-btn { background: #333; border: 3px solid white; padding: 18px 30px; color: white; font-size: 22px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- TELA DE ESCOLHA DE SKIN -->
    <div id="menu">
        <h2>ESCOLHA A ROUPA DA RAYSSA</h2>
        <button class="skin-btn" onclick="iniciarSkin('rayssa_vermelha.png')">🔴 Roupa Vermelha</button>
        <button class="skin-btn" onclick="iniciarSkin('rayssa_preta.png')">⚫ Roupa Preta</button>
    </div>

    <div class="info" id="faseTexto">FASE 1</div>
    
    <canvas id="gameCanvas" width="900" height="550"></canvas>

    <div class="controls">
        <button ontouchstart="mover(-6)" ontouchend="parar()" onmousedown="mover(-6)" onmouseup="parar()">◀</button>
        <button class="btn-jump" ontouchstart="pular()" onmousedown="pular()">▲ Pular</button>
        <button ontouchstart="mover(6)" ontouchend="parar()" onmousedown="mover(6)" onmouseup="parar()">▶</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const faseTexto = document.getElementById("faseTexto");

    const imgRayssa = new Image();
    const imgInimigo = new Image();
    imgInimigo.src = "inimigo.png";

    const imgFundo = new Image();

    let faseAtual = 1;
    const totalFases = 3; 

    let player = { x: 50, y: 350, width: 65, height: 85, dx: 0, dy: 0, noChao: false, viradoEsq: false };
    const gravidade = 0.5;

    // Fases com plataformas espaçadas (criando buracos reais para cair) e inimigos patrulhando
    const fases = {
        1: { 
            fundo: "fundo1.png",
            plataformas: [
                { x: 0, y: 470, width: 280, height: 80 },   // Pedaço inicial de chão
                { x: 360, y: 470, width: 250, height: 80 }, // Buraco entre 280 e 360
                { x: 680, y: 470, width: 220, height: 80 }, // Buraco entre 610 e 680
                { x: 220, y: 340, width: 150, height: 20 }, // Plataforma alta 1
                { x: 480, y: 250, width: 160, height: 20 }  // Plataforma alta 2
            ], 
            inimigos: [
                { x: 380, y: 395, width: 60, height: 75, dir: 2, minX: 360, maxX: 580, vivo: true },
                { x: 500, y: 195, width: 60, height: 75, dir: -2, minX: 480, maxX: 620, vivo: true }
            ],
            metaX: 830, metaY: 390, startX: 50, startY: 350 
        },
        2: { 
            fundo: "fundo2.png",
            plataformas: [
                { x: 0, y: 470, width: 200, height: 80 },
                { x: 280, y: 470, width: 180, height: 80 },
                { x: 540, y: 470, width: 360, height: 80 },
                { x: 220, y: 360, width: 130, height: 20 },
                { x: 420, y: 280, width: 130, height: 20 },
                { x: 650, y: 200, width: 150, height: 20 }
            ], 
            inimigos: [
                { x: 300, y: 395, width: 60, height: 75, dir: 2.5, minX: 280, maxX: 440, vivo: true },
                { x: 680, y: 125, width: 60, height: 75, dir: -2.5, minX: 650, maxX: 780, vivo: true }
            ],
            metaX: 810, metaY: 390, startX: 50, startY: 350 
        },
        3: { 
            fundo: "fundo3.png",
            plataformas: [
                { x: 0, y: 470, width: 150, height: 80 },
                { x: 230, y: 470, width: 150, height: 80 },
                { x: 460, y: 470, width: 150, height: 80 },
                { x: 690, y: 470, width: 210, height: 80 },
                { x: 180, y: 370, width: 100, height: 20 },
                { x: 360, y: 290, width: 100, height: 20 },
                { x: 550, y: 210, width: 100, height: 20 }
            ], 
            inimigos: [
                { x: 240, y: 395, width: 60, height: 75, dir: 2, minX: 230, maxX: 360, vivo: true },
                { x: 380, y: 215, width: 60, height: 75, dir: -2, minX: 360, maxX: 440, vivo: true },
                { x: 570, y: 135, width: 60, height: 75, dir: 3, minX: 550, maxX: 630, vivo: true }
            ],
            metaX: 820, metaY: 390, startX: 50, startY: 350 
        }
    };

    let inimigosAtuais = [];

    function iniciarSkin(skin) {
        imgRayssa.src = skin;
        document.getElementById("menu").style.display = "none";
        carregarFase(1);
        loop();
    }

    function carregarFase(n) {
        faseAtual = n;
        faseTexto.innerText = "FASE " + faseAtual;
        player.x = fases[n].startX;
        player.y = fases[n].startY;
        player.dx = 0;
        player.dy = 0;
        imgFundo.src = fases[n].fundo;
        inimigosAtuais = JSON.parse(JSON.stringify(fases[n].inimigos));
    }

    function mover(vel) { player.dx = vel; player.viradoEsq = (vel < 0); }
    function parar() { player.dx = 0; }
    function pular() { 
        if (player.noChao) { 
            player.dy = -13; 
            player.noChao = false; 
        } 
    }

    function loop() {
        // Física
        player.x += player.dx;
        player.dy += gravidade;
        player.y += player.dy;
        player.noChao = false;

        if (player.x < 0) player.x = 0;
        if (player.x > 840) player.x = 840;

        // Se cair no buraco (passar da altura do chão sem plataforma)
        if (player.y > 550) {
            carregarFase(faseAtual);
        }

        // Colisão com Plataformas
        fases[faseAtual].plataformas.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x && 
                player.y + player.height >= p.y && player.y + player.height - player.dy <= p.y) {
                player.dy = 0; 
                player.y = p.y - player.height; 
                player.noChao = true;
            }
        });

        // Inimigos e Colisão (Pular em cima para matar)
        inimigosAtuais.forEach(inimigo => {
            if (!inimigo.vivo) return;
            inimigo.x += inimigo.dir;
            if (inimigo.x > inimigo.maxX || inimigo.x < inimigo.minX) {
                inimigo.dir *= -1;
            }

            if (player.x < inimigo.x + inimigo.width - 10 && player.x + player.width > inimigo.x + 10 &&
                player.y < inimigo.y + inimigo.height && player.y + player.height > inimigo.y) {
                
                // Pular em cima mata o inimigo
                if (player.dy > 0 && player.y + player.height - player.dy <= inimigo.y + 25) {
                    inimigo.vivo = false;
                    player.dy = -10; // Impulso para cima
                } else {
                    carregarFase(faseAtual); // Toca em contato lateral
                }
            }
        });

        // Checar Vitória da Fase
        let meta = fases[faseAtual];
        if (player.x + player.width > meta.metaX && player.x < meta.metaX + 40 &&
            player.y + player.height > meta.metaY && player.y < meta.metaY + 80) {
            if (faseAtual < totalFases) {
                carregarFase(faseAtual + 1);
            } else {
                alert("🏆 Parabéns, Rayssa zerou todas as fases!");
                carregarFase(1);
            }
        }

        // --- RENDERIZAÇÃO ---
        ctx.clearRect(0, 0, 900, 550);
        
        // Fundo aleatório por fase (com cor de segurança se faltar imagem)
        if (imgFundo.complete && imgFundo.naturalWidth !== 0) {
            ctx.drawImage(imgFundo, 0, 0, 900, 550);
        } else {
            ctx.fillStyle = "#5c94fc";
            ctx.fillRect(0, 0, 900, 550);
        }

        // Plataformas e Chão (Mostrando os buracos)
        ctx.fillStyle = "#8b4513";
        fases[faseAtual].plataformas.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#2ecc71"; // Graminha
            ctx.fillRect(p.x, p.y, p.width, 8);
            ctx.fillStyle = "#8b4513";
        });

        // Bandeira / Meta
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(meta.metaX, meta.metaY, 35, 80);

        // Desenhar Inimigos
        inimigosAtuais.forEach(inimigo => {
            if (inimigo.vivo) {
                ctx.save();
                if (inimigo.dir < 0) {
                    ctx.scale(-1, 1);
                    if (imgInimigo.complete && imgInimigo.naturalWidth !== 0) {
                        ctx.drawImage(imgInimigo, -inimigo.x - inimigo.width, inimigo.y, inimigo.width, inimigo.height);
                    } else {
                        ctx.fillStyle = "#900c3f";
                        ctx.fillRect(-inimigo.x - inimigo.width, inimigo.y, inimigo.width, inimigo.height);
                    }
                } else {
                    if (imgInimigo.complete && imgInimigo.naturalWidth !== 0) {
                        ctx.drawImage(imgInimigo, inimigo.x, inimigo.y, inimigo.width, inimigo.height);
                    } else {
                        ctx.fillStyle = "#900c3f";
                        ctx.fillRect(inimigo.x, inimigo.y, inimigo.width, inimigo.height);
                    }
                }
                ctx.restore();
            }
        });

        // Desenhar Rayssa (com suporte a espelhamento correto)
        ctx.save();
        if (player.viradoEsq) {
            ctx.scale(-1, 1);
            if (imgRayssa.complete && imgRayssa.naturalWidth !== 0) {
                ctx.drawImage(imgRayssa, -player.x - player.width, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ff69b4";
                ctx.fillRect(-player.x - player.width, player.y, player.width, player.height);
            }
        } else {
            if (imgRayssa.complete && imgRayssa.naturalWidth !== 0) {
                ctx.drawImage(imgRayssa, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ff69b4";
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }
        ctx.restore();

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
