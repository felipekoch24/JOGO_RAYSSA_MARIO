<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Rayssa</title>
    <style>
        body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { background: #5c94fc; border: 4px solid #fff; border-radius: 8px; width: 95vw; max-width: 400px; height: auto; }
        .info { color: white; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        .controls { display: flex; gap: 15px; margin-top: 15px; }
        button { background: #e60012; border: none; padding: 20px 30px; color: white; font-size: 24px; border-radius: 10px; box-shadow: 0 5px #990000; }
        button:active { box-shadow: 0 2px #990000; transform: translateY(3px); }
    </style>
</head>
<body>

    <div class="info" id="faseTexto">FASE 1</div>
    <canvas id="gameCanvas" width="400" height="300"></canvas>

    <div class="controls">
        <button ontouchstart="mover(-4)" ontouchend="parar()" onmousedown="mover(-4)" onmouseup="parar()">◀</button>
        <button ontouchstart="pular()" onmousedown="pular()">▲</button>
        <button ontouchstart="mover(4)" ontouchend="parar()" onmousedown="mover(4)" onmouseup="parar()">▶</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const faseTexto = document.getElementById("faseTexto");

    const imgRayssa = new Image();
    imgRayssa.src = "rayssa.png";

    const imagensFundo = { 1: "fundo1.png", 2: "fundo2.png", 3: "fundo1.png" };
    const imgFundo = new Image();

    let faseAtual = 1;
    const totalFases = 3; 

    let player = { x: 30, y: 200, width: 40, height: 45, dx: 0, dy: 0, noChao: false, viradoEsq: false };
    const gravidade = 0.4;

    const fases = {
        1: { plataformas: [{ x: 0, y: 260, width: 400, height: 40 }, { x: 150, y: 180, width: 100, height: 15 }, { x: 300, y: 120, width: 80, height: 15 }], metaX: 360, startX: 30, startY: 200 },
        2: { plataformas: [{ x: 0, y: 260, width: 100, height: 40 }, { x: 130, y: 210, width: 70, height: 15 }, { x: 230, y: 160, width: 70, height: 15 }, { x: 320, y: 110, width: 60, height: 15 }], metaX: 360, startX: 30, startY: 200 },
        3: { plataformas: [{ x: 0, y: 260, width: 80, height: 40 }, { x: 110, y: 200, width: 60, height: 15 }, { x: 200, y: 150, width: 60, height: 15 }, { x: 290, y: 100, width: 60, height: 15 }], metaX: 360, startX: 30, startY: 200 }
    };

    function carregarFase(n) {
        faseAtual = n;
        faseTexto.innerText = "FASE " + faseAtual;
        // CORREÇÃO: Reset absoluto de posição e velocidade
        player.x = fases[n].startX;
        player.y = fases[n].startY;
        player.dx = 0;
        player.dy = 0;
        imgFundo.src = imagensFundo[n] || "";
    }

    function mover(vel) { player.dx = vel; player.viradoEsq = (vel < 0); }
    function parar() { player.dx = 0; }
    function pular() { if (player.noChao) { player.dy = -9; player.noChao = false; } }

    function loop() {
        player.x += player.dx;
        player.dy += gravidade;
        player.y += player.dy;
        player.noChao = false;

        // Resetar se cair da tela
        if (player.y > 300) carregarFase(faseAtual);

        fases[faseAtual].plataformas.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x && 
                player.y + player.height >= p.y && player.y + player.height - player.dy <= p.y) {
                player.dy = 0; player.y = p.y - player.height; player.noChao = true;
            }
        });

        if (player.x > fases[faseAtual].metaX) {
            if (faseAtual < totalFases) {
                carregarFase(faseAtual + 1);
            } else {
                alert("🏆 Parabéns, você zerou!");
                carregarFase(1);
            }
        }

        ctx.clearRect(0, 0, 400, 300);
        if (imgFundo.complete) ctx.drawImage(imgFundo, 0, 0, 400, 300);
        
        ctx.fillStyle = "#8b4513";
        fases[faseAtual].plataformas.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(fases[faseAtual].metaX, 210, 20, 50);

        ctx.save();
        if (player.viradoEsq) {
            ctx.scale(-1, 1);
            ctx.drawImage(imgRayssa, -player.x - player.width, player.y, player.width, player.height);
        } else {
            ctx.drawImage(imgRayssa, player.x, player.y, player.width, player.height);
        }
        ctx.restore();

        requestAnimationFrame(loop);
    }

    imgRayssa.onload = () => { carregarFase(1); loop(); };
</script>
</body>
</html>
